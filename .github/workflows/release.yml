name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = & ./scripts/Test-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG
          if (-not (Test-Path "docs/releases/$($env:RELEASE_TAG).md" -PathType Leaf)) {
            throw "Release notes are missing for $env:RELEASE_TAG."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Release tooling regression tests
        shell: pwsh
        run: ./tests/ReleaseTooling.Tests.ps1

      - name: Install ARM64 C++ tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio was not found."
          }

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify `
            --installPath $vsPath `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            --quiet `
            --norestart `
            --nocache `
            --wait
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "Failed to install ARM64 C++ tools. Exit code: $LASTEXITCODE"
          }

      - name: Build Release executables
        shell: pwsh
        run: |
          $platforms = @("x64", "Win32", "ARM64")
          foreach ($platform in $platforms) {
            msbuild FFKeyLock.slnx /t:Rebuild /p:Configuration=Release /p:Platform=$platform /m
            if ($LASTEXITCODE -ne 0) {
              throw "Build failed for $platform."
            }
          }

      - name: Verify executable versions
        shell: pwsh
        run: ./scripts/Test-ReleaseVersion.ps1 -Artifacts @("x64/Release/FFKeyLock.exe", "Release/FFKeyLock.exe", "ARM64/Release/FFKeyLock.exe")

      - name: Regression tests
        shell: pwsh
        run: |
          foreach ($platform in @("x64", "Win32")) {
            msbuild tests/FFKeyLock.Tests.vcxproj /p:Configuration=Release /p:Platform=$platform /m
            if ($LASTEXITCODE -ne 0) { throw "Test build failed for $platform." }
            & "tests/artifacts/$platform/FFKeyLock.Tests.exe" "$PWD/tests/artifacts"
            if ($LASTEXITCODE -ne 0) { throw "Regression tests failed for $platform." }
          }

      - name: Verify runtime dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with VC tools was not found."
          }

          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -like "*\Hostx64\x64\dumpbin.exe" } |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found."
          }

          $executables = @(
            "x64\Release\FFKeyLock.exe",
            "Release\FFKeyLock.exe",
            "ARM64\Release\FFKeyLock.exe"
          )

          foreach ($exe in $executables) {
            $deps = & $dumpbin.FullName /DEPENDENTS $exe
            $deps | Out-String | Write-Host

            $forbidden = $deps | Select-String -Pattern "MSVCP|VCRUNTIME|api-ms-win-crt"
            if ($forbidden) {
              throw "$exe depends on VC++ runtime DLLs. Build must use the static runtime (/MT)."
            }
          }

      - name: Smoke test executable startup
        shell: pwsh
        run: |
          $executables = @(
            "x64\Release\FFKeyLock.exe",
            "Release\FFKeyLock.exe"
          )

          foreach ($exe in $executables) {
            $config = Join-Path $env:RUNNER_TEMP "FFKeyLock-smoke.ini"
            "[Settings]`nVersion=2`nProtectionEnabled=0`n[Library]`nCount=0" | Set-Content $config
            $process = Start-Process -FilePath "$PWD\$exe" -ArgumentList @('--background', '--config', ('"' + $config + '"')) -WindowStyle Hidden -PassThru
            Start-Sleep -Seconds 3
            $running = Get-Process -Id $process.Id -ErrorAction SilentlyContinue
            if (-not $running) {
              throw "$exe exited immediately during startup smoke test."
            }
            Stop-Process -Id $process.Id -Force
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Installer language regression tests
        shell: pwsh
        run: ./tests/InstallerLanguage.Tests.ps1 -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - name: Build installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = "${{ steps.version.outputs.version }}"
          foreach ($arch in @("x64", "x86", "arm64")) {
            & $iscc installer\FFKeyLock.iss /DAppVersion=$version /DAppArchitecture=$arch
            if ($LASTEXITCODE -ne 0) {
              throw "Installer build failed for $arch."
            }
          }

      - name: Verify installer output
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          foreach ($arch in @("x64", "x86", "arm64")) {
            $installer = "installer\output\FFKeyLock-Setup-v$version-$arch.exe"
            if (-not (Test-Path $installer)) {
              throw "Installer was not generated: $installer"
            }
            & ./scripts/Test-ReleaseVersion.ps1 -Artifacts @($installer)
            Get-Item $installer | Format-List FullName,Length,LastWriteTime
          }

      - name: Smoke test installed executable
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          foreach ($arch in @("x64", "x86")) {
            $installer = "$PWD\installer\output\FFKeyLock-Setup-v$version-$arch.exe"
            $installDir = Join-Path $env:RUNNER_TEMP "FFKeyLockInstallSmoke-$arch"

            if (Test-Path $installDir) {
              Remove-Item -LiteralPath $installDir -Recurse -Force
            }

            $setup = Start-Process -FilePath $installer `
              -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=english", "/DIR=$installDir") `
              -Wait `
              -PassThru

            if ($setup.ExitCode -ne 0) {
              throw "$arch installer smoke install failed with exit code $($setup.ExitCode)."
            }

            $exe = Join-Path $installDir "FFKeyLock.exe"
            if (-not (Test-Path $exe)) {
              throw "Installed executable was not found: $exe"
            }

            $config = Join-Path $env:RUNNER_TEMP "FFKeyLock-installed-smoke.ini"
            "[Settings]`nVersion=2`nProtectionEnabled=0`n[Library]`nCount=0" | Set-Content $config
            $process = Start-Process -FilePath $exe -ArgumentList @('--background', '--config', ('"' + $config + '"')) -WindowStyle Hidden -PassThru
            Start-Sleep -Seconds 3
            $running = Get-Process -Id $process.Id -ErrorAction SilentlyContinue
            if (-not $running) {
              throw "Installed FFKeyLock.exe exited immediately during installer smoke test."
            }
            Stop-Process -Id $process.Id -Force
          }

      - name: Create portable packages
        shell: pwsh
        run: |
          foreach ($arch in @("x64", "x86", "arm64")) {
            $archive = & ./scripts/New-PortablePackage.ps1 -Architecture $arch
            & ./tests/PortablePackage.Tests.ps1 -Archive $archive
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FFKeyLock ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            installer/output/FFKeyLock-Setup-v${{ steps.version.outputs.version }}-x64.exe
            installer/output/FFKeyLock-Setup-v${{ steps.version.outputs.version }}-x86.exe
            installer/output/FFKeyLock-Setup-v${{ steps.version.outputs.version }}-arm64.exe
            dist/FFKeyLock-v${{ steps.version.outputs.version }}-x64.zip
            dist/FFKeyLock-v${{ steps.version.outputs.version }}-x86.zip
            dist/FFKeyLock-v${{ steps.version.outputs.version }}-arm64.zip
